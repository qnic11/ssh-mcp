[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
version = "0.1.0"
description = "A small, strict-host-verifying SSH MCP server for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.13,<2"]

[project.scripts]
ssh-mcp = "ssh_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
